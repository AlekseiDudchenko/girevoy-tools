name: Calendar source review
on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshots and identify changes
        run: node scripts/calendar-import.mjs
      - name: Review summary
        if: always()
        run: cat calendar-review/review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-review
          path: calendar-review/
          retention-days: 90
