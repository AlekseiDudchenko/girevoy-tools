name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Ежедневная пересборка: ленты подписки и страница календаря без JavaScript делят
  # турниры на предстоящие и прошедшие по дате сборки — без неё прошедшие остаются в лентах.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  deployments: write

concurrency:
  group: tools-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test
        run: npm run check

      # Продакшен — только main. Проект Cloudflare Pages vsegiri-tools с доменом
      # tools.vsegiri.com создаётся вручную; секреты CLOUDFLARE_API_TOKEN и
      # CLOUDFLARE_ACCOUNT_ID — в настройках репозитория; включается переменной
      # репозитория CLOUDFLARE_DEPLOY=true.
      - name: Deploy production to Cloudflare Pages
        # Пока секретов нет, шаг пропускается, а проверка остаётся зелёной.
        # Ручной запуск (workflow_dispatch) на main тоже публикует.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=vsegiri-tools --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
