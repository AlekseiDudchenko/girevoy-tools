name: Build and deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: tools-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test
        run: npm run check

      # Продакшен — только main. Проект Cloudflare Pages vsegiri-tools с доменом
      # tools.vsegiri.com создаётся вручную; секреты CLOUDFLARE_API_TOKEN и
      # CLOUDFLARE_ACCOUNT_ID — в настройках репозитория.
      - name: Deploy production to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=vsegiri-tools --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
